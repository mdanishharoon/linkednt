name: Backend CI & Deploy

# Pairs with landing.yml. Push to a long-lived branch deploys the
# Supabase backend (migrations + edge functions) to the matching project:
#   main → production Supabase project
#   dev  → sandbox  Supabase project
#
# Same branch ↔ env mapping rule as landing.yml. PRs only typecheck;
# nothing deploys until the merge lands on the long-lived branch.

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - "packages/backend/**"
      - ".github/workflows/backend.yml"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: [main, dev]
    paths:
      - "packages/backend/**"
      - ".github/workflows/backend.yml"
      - "package.json"
      - "bun.lock"

# Required GitHub environments (Settings → Environments):
#   production
#     Vars:    SUPABASE_PROJECT_REF (=gmzisvcyvjrsjrovvysz)
#     Secrets: SUPABASE_ACCESS_TOKEN (personal access token from
#              supabase.com/dashboard/account/tokens; same token works
#              across projects in the same org, but env-scope it so we
#              never accidentally use a prod-bound token from a sandbox
#              workflow run)
#   sandbox
#     Vars:    SUPABASE_PROJECT_REF (sandbox project ref)
#     Secrets: SUPABASE_ACCESS_TOKEN

jobs:
  typecheck:
    name: Typecheck shared backend code
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      # Deno's typecheck is the canonical check for edge functions —
      # `deno check` mirrors what Supabase runs at deploy time. If it
      # passes here, the deploy step on the target branch won't surprise
      # us with a type error.
      - name: Typecheck edge functions
        run: |
          set -e
          for fn in packages/backend/supabase/functions/*/index.ts; do
            echo "::group::deno check $fn"
            deno check "$fn"
            echo "::endgroup::"
          done

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'sandbox' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Push migrations first so any new RPCs the functions depend on
      # exist before the function code lands. --include-all means we
      # apply every local migration the remote hasn't seen yet, which is
      # safe because every migration is idempotent (create or replace,
      # if not exists, etc.).
      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: packages/backend
        run: supabase db push --linked --include-all --password "" || supabase db push --project-ref ${{ vars.SUPABASE_PROJECT_REF }} --include-all --password ""

      # Each function deploys independently. --no-verify-jwt is set per
      # function based on the verify_jwt setting we want in production:
      #   - rewrite:               JWT required (proxy users sign in)
      #   - create-polar-checkout: anonymous (public buy button)
      #   - polar-webhook:         anonymous (Polar can't carry a JWT)
      - name: Deploy rewrite function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: packages/backend
        run: supabase functions deploy rewrite --project-ref ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Deploy create-polar-checkout function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: packages/backend
        run: supabase functions deploy create-polar-checkout --project-ref ${{ vars.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy polar-webhook function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: packages/backend
        run: supabase functions deploy polar-webhook --project-ref ${{ vars.SUPABASE_PROJECT_REF }} --no-verify-jwt
