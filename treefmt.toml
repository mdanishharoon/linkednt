[global]
excludes = [
  "node_modules/**",
  ".plasmo/**",
  "build/**",
  "dist/**",
  "bun.lockb",
]

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = [
  "*.ts",
  "*.tsx",
  "*.js",
  "*.jsx",
  "*.css",
  "*.json",
  "*.md",
  "*.yaml",
  "*.yml",
]
